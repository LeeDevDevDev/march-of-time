<div>
  <p
    class="text-xs leading-relaxed"
    [class.text-[#EBF5F3]]="tone() === 'dark'"
    [class.text-[var(--mot-text)]]="tone() !== 'dark'"
  >
    @for (seg of segments(); track $index) {
      @if (seg.keyword; as kw) {
        <span
          #kwSpan
          tabindex="0"
          (mouseenter)="showKeyword(kw, $event.currentTarget)"
          (mouseleave)="hideKeyword($event.currentTarget)"
          (focus)="showKeyword(kw, $event.currentTarget)"
          (blur)="hideKeyword($event.currentTarget)"
          class="inline cursor-help rounded px-1 py-0.5 font-bold underline decoration-dotted underline-offset-4 transition-colors hover:bg-[#122220] hover:text-[#FF8C5A]"
          [class.bg-[#122220]]="keywordTooltip.activeAnchor() === kwSpan"
          [class.text-[#FF8C5A]]="tone() === 'dark' || keywordTooltip.activeAnchor() === kwSpan"
          [class.text-[var(--mot-accent-text)]]="tone() !== 'dark' && keywordTooltip.activeAnchor() !== kwSpan"
        >{{ seg.text }}</span>
      } @else {
        <span>{{ seg.text }}</span>
      }
    }
  </p>

  @if (showHintWhenIdle() && hasAnyKeywords()) {
    <p
      class="mt-2.5 border-t pt-2 text-xs"
      [class.border-[#243B37]]="tone() === 'dark'"
      [class.text-[#8AB0AB]]="tone() === 'dark'"
      [class.border-[var(--mot-border)]]="tone() !== 'dark'"
      [class.text-[var(--mot-muted)]]="tone() !== 'dark'"
    >
      Hover any
      <span
        class="font-bold underline decoration-dotted"
        [class.text-[#FF8C5A]]="tone() === 'dark'"
        [class.text-[var(--mot-accent-text)]]="tone() !== 'dark'"
      >underlined keyword</span>
      above to inspect its rule &amp; linked terms.
    </p>
  }
</div>
