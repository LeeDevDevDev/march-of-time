@if (open) {
  <div
    class="fixed inset-0 z-[80] flex items-center justify-center bg-black/75 p-4"
    role="alertdialog"
    aria-modal="true"
    [attr.aria-labelledby]="'confirm-dialog-title'"
    [attr.aria-describedby]="'confirm-dialog-desc'"
    (mousedown)="onBackdropMouseDown($event)"
  >
    <div
      class="w-full max-w-md overflow-hidden rounded-2xl border border-[var(--mot-border)] bg-[var(--mot-surface)] text-[var(--mot-text)]"
      (mousedown)="$event.stopPropagation()"
      (click)="$event.stopPropagation()"
    >
      <!-- Night Pine Header with Crimson Warning Emblem -->
      <div
        class="flex items-start justify-between gap-3 border-b border-[#243B37] bg-[#122220] px-6 py-4 text-[#EBF5F3]"
      >
        <div class="flex items-center gap-3">
          <div
            class="flex h-10 w-10 shrink-0 items-center justify-center rounded-xl border border-[#F26464]/40 bg-[#F26464]/15 text-[#F26464]"
          >
            <svg
              class="h-5 w-5"
              viewBox="0 0 24 24"
              fill="none"
              stroke="currentColor"
              stroke-width="2"
              stroke-linecap="round"
              stroke-linejoin="round"
              aria-hidden="true"
            >
              <path d="M3 6h18" />
              <path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6" />
              <path d="M8 6V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2" />
              <line x1="10" y1="11" x2="10" y2="17" />
              <line x1="14" y1="11" x2="14" y2="17" />
            </svg>
          </div>
          <div>
            <h2
              id="confirm-dialog-title"
              class="font-display text-lg font-bold text-white"
            >
              {{ title }}
            </h2>
            <p class="text-xs text-[#8AB0AB]">
              Removed from the active Compendium (safe for existing characters).
            </p>
          </div>
        </div>

        <button
          type="button"
          [disabled]="isLoading"
          (click)="cancel.emit()"
          class="text-xs font-bold text-[#8AB0AB] hover:text-white disabled:opacity-40"
        >
          Close
        </button>
      </div>

      <!-- Body -->
      <div class="p-6 space-y-4">
        <!-- Target Item Pill Card -->
        <div
          class="flex items-center justify-between gap-3 rounded-xl border border-[var(--mot-border)] bg-[var(--mot-well)] px-4 py-3"
        >
          <div class="min-w-0">
            <div class="text-xs font-semibold text-[var(--mot-muted)]">
              Target Entry
            </div>
            <div class="truncate font-display text-base font-bold text-[var(--mot-text)]">
              {{ itemName }}
            </div>
          </div>
          @if (badge) {
            <span
              class="shrink-0 rounded-md border border-[var(--mot-border)] bg-[var(--mot-surface)] px-2.5 py-1 font-mono-num text-xs font-bold text-[var(--mot-accent-text)]"
            >
              {{ badge }}
            </span>
          }
        </div>

        <p
          id="confirm-dialog-desc"
          class="text-xs leading-relaxed text-[var(--mot-muted)]"
        >
          {{ message }}
        </p>

        @if (warningNote) {
          <div
            class="rounded-xl border border-[var(--mot-hp)]/40 bg-[var(--mot-hp-bg)] px-3.5 py-2.5 text-xs font-semibold text-[var(--mot-hp-text)]"
          >
            {{ warningNote }}
          </div>
        }

        <!-- Actions -->
        <div class="flex flex-wrap items-center justify-end gap-2 border-t border-[var(--mot-border)] pt-4">
          <button
            type="button"
            [disabled]="isLoading"
            (click)="cancel.emit()"
            class="rounded-lg border border-[var(--mot-border)] bg-[var(--mot-well)] px-3.5 py-2 text-xs font-semibold text-[var(--mot-text)] hover:border-[#C4491A] disabled:opacity-50"
          >
            Cancel
          </button>

          <button
            type="button"
            [disabled]="isLoading"
            (click)="confirm.emit()"
            class="inline-flex items-center gap-2 rounded-lg border border-[#B82E2E] bg-[#B82E2E] px-4 py-2 text-xs font-semibold text-white transition-colors hover:bg-[#992222] disabled:opacity-50"
          >
            @if (isLoading) {
              <svg
                class="h-3.5 w-3.5 animate-spin"
                viewBox="0 0 24 24"
                fill="none"
                aria-hidden="true"
              >
                <circle
                  class="opacity-25"
                  cx="12"
                  cy="12"
                  r="10"
                  stroke="currentColor"
                  stroke-width="3"
                ></circle>
                <path
                  class="opacity-90"
                  fill="currentColor"
                  d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"
                ></path>
              </svg>
              <span>Deleting...</span>
            } @else {
              <span>{{ confirmLabel }}</span>
            }
          </button>
        </div>
      </div>
    </div>
  </div>
}
