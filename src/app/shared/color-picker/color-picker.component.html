@if (mode() === 'inline') {
  <div
    class="space-y-2.5 rounded-xl border p-3"
    [class.border-[#243B37]]="surfaceTheme() === 'dark'"
    [class.bg-[#09100F]]="surfaceTheme() === 'dark'"
    [class.border-[var(--mot-border)]]="surfaceTheme() !== 'dark'"
    [class.bg-[var(--mot-well)]]="surfaceTheme() !== 'dark'"
  >
    <div
      #svArea
      (pointerdown)="onSvPointerDown($event)"
      (pointermove)="onSvPointerMove($event)"
      (pointerup)="onSvPointerUp($event)"
      (pointercancel)="onSvPointerUp($event)"
      class="relative h-28 w-full cursor-crosshair touch-none overflow-hidden rounded-lg border border-black/30 select-none"
      [style.background-color]="pureHueHex()"
    >
      <div
        class="pointer-events-none absolute inset-0"
        style="background: linear-gradient(to right, #ffffff, rgba(255, 255, 255, 0))"
      ></div>
      <div
        class="pointer-events-none absolute inset-0"
        style="background: linear-gradient(to top, #000000, rgba(0, 0, 0, 0))"
      ></div>
      <div
        class="pointer-events-none absolute h-4 w-4 -translate-x-1/2 -translate-y-1/2 rounded-full border-2 border-white shadow-[0_0_0_1.5px_rgba(0,0,0,0.75)]"
        [style.left.%]="svThumbLeftPct()"
        [style.top.%]="svThumbTopPct()"
        [style.background-color]="normalizedColor()"
      ></div>
    </div>

    <div
      #hueArea
      tabindex="0"
      role="slider"
      aria-label="Color Hue"
      [attr.aria-valuenow]="hue()"
      aria-valuemin="0"
      aria-valuemax="360"
      (pointerdown)="onHuePointerDown($event)"
      (pointermove)="onHuePointerMove($event)"
      (pointerup)="onHuePointerUp($event)"
      (pointercancel)="onHuePointerUp($event)"
      (keydown)="onHueKeyDown($event)"
      class="relative h-3.5 w-full cursor-pointer touch-none rounded-full border border-black/30 select-none focus:outline-none"
      style="background: linear-gradient(to right, #ff0000 0%, #ffff00 17%, #00ff00 33%, #00ffff 50%, #0000ff 67%, #ff00ff 83%, #ff0000 100%)"
    >
      <div
        class="pointer-events-none absolute top-1/2 h-4 w-4 -translate-x-1/2 -translate-y-1/2 rounded-full border-2 border-white shadow-[0_0_0_1.5px_rgba(0,0,0,0.75)]"
        [style.left.%]="hueThumbLeftPct()"
        [style.background-color]="pureHueHex()"
      ></div>
    </div>

    <div class="flex items-center justify-between gap-2">
      <div class="flex flex-1 items-center gap-2">
        <span
          class="h-7 w-7 shrink-0 rounded-lg border border-white/25 shadow-inner"
          [style.background-color]="normalizedColor()"
        ></span>
        <input
          type="text"
          maxlength="7"
          aria-label="Hex color code"
          [ngModel]="hexDraft()"
          [ngModelOptions]="{ standalone: true }"
          (focus)="onHexFocus()"
          (ngModelChange)="onHexInput($event)"
          (blur)="commitHexDraft()"
          (keydown.enter)="commitHexDraft(); $event.preventDefault()"
          class="w-28 rounded-lg border px-2.5 py-1 font-mono-num text-xs font-bold uppercase focus:border-[#C4491A] focus:outline-none"
          [class.border-[#243B37]]="surfaceTheme() === 'dark'"
          [class.bg-[#142220]]="surfaceTheme() === 'dark'"
          [class.text-white]="surfaceTheme() === 'dark'"
          [class.border-[var(--mot-border)]]="surfaceTheme() !== 'dark'"
          [class.bg-[var(--mot-surface)]]="surfaceTheme() !== 'dark'"
          [class.text-[var(--mot-text)]]="surfaceTheme() !== 'dark'"
        />
      </div>

      <label
        title="Open system eyedropper / color dialog"
        class="relative inline-flex cursor-pointer items-center gap-1.5 rounded-lg border px-2.5 py-1 text-[11px] font-semibold transition-colors hover:border-[#C4491A]"
        [class.border-[#243B37]]="surfaceTheme() === 'dark'"
        [class.bg-[#142220]]="surfaceTheme() === 'dark'"
        [class.text-[#8AB0AB]]="surfaceTheme() === 'dark'"
        [class.border-[var(--mot-border)]]="surfaceTheme() !== 'dark'"
        [class.bg-[var(--mot-surface)]]="surfaceTheme() !== 'dark'"
        [class.text-[var(--mot-muted)]]="surfaceTheme() !== 'dark'"
      >
        <svg class="h-3.5 w-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="m2 22 1-1h3l9-9" />
          <path d="M3 21v-3l9-9" />
          <path d="m15 6 3.4-3.4a2.1 2.1 0 1 1 3 3L18 9l.4.4a2.1 2.1 0 1 1-3 3l-3.8-3.8a2.1 2.1 0 1 1 3-3l.4.4Z" />
        </svg>
        <span>Dropper</span>
        <input
          type="color"
          [ngModel]="normalizedColor()"
          [ngModelOptions]="{ standalone: true }"
          (ngModelChange)="onNativeColorChange($event)"
          class="sr-only"
        />
      </label>
    </div>

    @if (presets().length > 0) {
      <div
        class="flex flex-wrap items-center gap-1.5 border-t pt-2"
        [class.border-[#243B37]]="surfaceTheme() === 'dark'"
        [class.border-[var(--mot-border)]]="surfaceTheme() !== 'dark'"
      >
        <span
          class="mr-1 text-[10px] font-semibold uppercase tracking-wider"
          [class.text-[#8AB0AB]]="surfaceTheme() === 'dark'"
          [class.text-[var(--mot-muted)]]="surfaceTheme() !== 'dark'"
        >
          Presets
        </span>
        @for (sw of presets(); track sw) {
          <button
            type="button"
            [title]="sw"
            (click)="selectPreset(sw)"
            class="h-5 w-5 rounded-full border-2 transition-transform hover:scale-110"
            [style.background-color]="sw"
            [class.border-white]="isPresetSelected(sw)"
            [class.scale-110]="isPresetSelected(sw)"
            [class.border-transparent]="!isPresetSelected(sw)"
          ></button>
        }
      </div>
    }
  </div>
} @else {
  <div class="relative inline-flex flex-wrap items-center gap-1.5">
    @for (sw of presets(); track sw) {
      <button
        type="button"
        [title]="sw"
        (click)="selectPreset(sw)"
        class="h-5 w-5 rounded-full border-2 transition-transform hover:scale-110"
        [style.background-color]="sw"
        [class.border-white]="isPresetSelected(sw)"
        [class.scale-110]="isPresetSelected(sw)"
        [class.border-transparent]="!isPresetSelected(sw)"
      ></button>
    }

    <button
      type="button"
      (click)="togglePopover()"
      class="inline-flex items-center gap-1.5 rounded-lg border px-2 py-1 font-mono-num text-[11px] font-bold transition-colors hover:border-[#C4491A]"
      [class.border-[#C4491A]]="popoverOpen()"
      [class.border-[#243B37]]="!popoverOpen() && surfaceTheme() === 'dark'"
      [class.bg-[#142220]]="surfaceTheme() === 'dark'"
      [class.text-white]="surfaceTheme() === 'dark'"
      [class.border-[var(--mot-border)]]="!popoverOpen() && surfaceTheme() !== 'dark'"
      [class.bg-[var(--mot-surface)]]="surfaceTheme() !== 'dark'"
      [class.text-[var(--mot-text)]]="surfaceTheme() !== 'dark'"
      title="Open Color Picker"
    >
      <span
        class="h-3.5 w-3.5 rounded-sm border border-white/25"
        [style.background-color]="normalizedColor()"
      ></span>
      <span>{{ normalizedColor() }}</span>
    </button>

    @if (popoverOpen()) {
      <div
        class="absolute top-full z-50 mt-2 w-64 space-y-2.5 rounded-xl border p-3 shadow-2xl"
        [class.left-0]="popoverAlign() === 'left'"
        [class.right-0]="popoverAlign() === 'right'"
        [class.border-[#355650]]="surfaceTheme() === 'dark'"
        [class.bg-[#0D1615]]="surfaceTheme() === 'dark'"
        [class.border-[var(--mot-border-strong)]]="surfaceTheme() !== 'dark'"
        [class.bg-[var(--mot-surface)]]="surfaceTheme() !== 'dark'"
      >
        <div
          #svArea
          (pointerdown)="onSvPointerDown($event)"
          (pointermove)="onSvPointerMove($event)"
          (pointerup)="onSvPointerUp($event)"
          (pointercancel)="onSvPointerUp($event)"
          class="relative h-28 w-full cursor-crosshair touch-none overflow-hidden rounded-lg border border-black/30 select-none"
          [style.background-color]="pureHueHex()"
        >
          <div
            class="pointer-events-none absolute inset-0"
            style="background: linear-gradient(to right, #ffffff, rgba(255, 255, 255, 0))"
          ></div>
          <div
            class="pointer-events-none absolute inset-0"
            style="background: linear-gradient(to top, #000000, rgba(0, 0, 0, 0))"
          ></div>
          <div
            class="pointer-events-none absolute h-4 w-4 -translate-x-1/2 -translate-y-1/2 rounded-full border-2 border-white shadow-[0_0_0_1.5px_rgba(0,0,0,0.75)]"
            [style.left.%]="svThumbLeftPct()"
            [style.top.%]="svThumbTopPct()"
            [style.background-color]="normalizedColor()"
          ></div>
        </div>

        <div
          #hueArea
          tabindex="0"
          role="slider"
          aria-label="Color Hue"
          [attr.aria-valuenow]="hue()"
          aria-valuemin="0"
          aria-valuemax="360"
          (pointerdown)="onHuePointerDown($event)"
          (pointermove)="onHuePointerMove($event)"
          (pointerup)="onHuePointerUp($event)"
          (pointercancel)="onHuePointerUp($event)"
          (keydown)="onHueKeyDown($event)"
          class="relative h-3.5 w-full cursor-pointer touch-none rounded-full border border-black/30 select-none focus:outline-none"
          style="background: linear-gradient(to right, #ff0000 0%, #ffff00 17%, #00ff00 33%, #00ffff 50%, #0000ff 67%, #ff00ff 83%, #ff0000 100%)"
        >
          <div
            class="pointer-events-none absolute top-1/2 h-4 w-4 -translate-x-1/2 -translate-y-1/2 rounded-full border-2 border-white shadow-[0_0_0_1.5px_rgba(0,0,0,0.75)]"
            [style.left.%]="hueThumbLeftPct()"
            [style.background-color]="pureHueHex()"
          ></div>
        </div>

        <div class="flex items-center justify-between gap-1.5">
          <div class="flex items-center gap-1.5">
            <span
              class="h-6 w-6 shrink-0 rounded-md border border-white/25"
              [style.background-color]="normalizedColor()"
            ></span>
            <input
              type="text"
              maxlength="7"
              aria-label="Hex color code"
              [ngModel]="hexDraft()"
              [ngModelOptions]="{ standalone: true }"
              (focus)="onHexFocus()"
              (ngModelChange)="onHexInput($event)"
              (blur)="commitHexDraft()"
              (keydown.enter)="commitHexDraft(); $event.preventDefault()"
              class="w-24 rounded-lg border px-2 py-1 font-mono-num text-xs font-bold uppercase focus:border-[#C4491A] focus:outline-none"
              [class.border-[#243B37]]="surfaceTheme() === 'dark'"
              [class.bg-[#142220]]="surfaceTheme() === 'dark'"
              [class.text-white]="surfaceTheme() === 'dark'"
              [class.border-[var(--mot-border)]]="surfaceTheme() !== 'dark'"
              [class.bg-[var(--mot-well)]]="surfaceTheme() !== 'dark'"
              [class.text-[var(--mot-text)]]="surfaceTheme() !== 'dark'"
            />
          </div>

          <div class="flex items-center gap-1">
            <label
              title="System Eyedropper"
              class="relative inline-flex h-7 w-7 cursor-pointer items-center justify-center rounded-lg border transition-colors hover:border-[#C4491A]"
              [class.border-[#243B37]]="surfaceTheme() === 'dark'"
              [class.bg-[#142220]]="surfaceTheme() === 'dark'"
              [class.text-[#8AB0AB]]="surfaceTheme() === 'dark'"
              [class.border-[var(--mot-border)]]="surfaceTheme() !== 'dark'"
              [class.bg-[var(--mot-well)]]="surfaceTheme() !== 'dark'"
              [class.text-[var(--mot-muted)]]="surfaceTheme() !== 'dark'"
            >
              <svg class="h-3.5 w-3.5" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="m2 22 1-1h3l9-9" />
                <path d="M3 21v-3l9-9" />
                <path d="m15 6 3.4-3.4a2.1 2.1 0 1 1 3 3L18 9l.4.4a2.1 2.1 0 1 1-3 3l-3.8-3.8a2.1 2.1 0 1 1 3-3l.4.4Z" />
              </svg>
              <input
                type="color"
                [ngModel]="normalizedColor()"
                [ngModelOptions]="{ standalone: true }"
                (ngModelChange)="onNativeColorChange($event)"
                class="sr-only"
              />
            </label>

            <button
              type="button"
              (click)="closePopover()"
              class="rounded-lg bg-[#C4491A] px-2.5 py-1 text-[11px] font-bold text-white hover:bg-[#D95522]"
            >
              Done
            </button>
          </div>
        </div>
      </div>
    }
  </div>
}
